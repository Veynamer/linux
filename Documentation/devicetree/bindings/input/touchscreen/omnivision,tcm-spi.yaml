%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/omnivision,tcm-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Omnivision TouchComm touchscreen controller (SPI)

maintainers:
  - Veynamer <veyr1thalone@gmail.com>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: omnivision,tcm-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  firmware-name:
    description:
      Name of the firmware image loaded into the controller when it is in
      HDL/ROMBOOT mode.

  omnivision,irq-gpio:
    description: GPIO connected to the controller interrupt line.
    maxItems: 1

  omnivision,reset-gpio:
    description: GPIO connected to the controller reset line.
    maxItems: 1

  omnivision,power-gpio:
    description: GPIO controlling the controller power.
    maxItems: 1

  omnivision,tpio-reset-gpio:
    description: GPIO connected to the test-point reset line.
    maxItems: 1

  omnivision,irq-on-state:
    description: Value driven on the IRQ GPIO when the interrupt is active.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  omnivision,reset-on-state:
    description: Value driven on the reset GPIO to assert reset.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  omnivision,power-on-state:
    description: Value driven on the power GPIO to power the controller on.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  omnivision,power-delay-ms:
    description: Delay in milliseconds after enabling power.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,reset-active-ms:
    description: Duration in milliseconds the reset line is held asserted.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,reset-delay-ms:
    description: Delay in milliseconds after releasing reset.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,pwr-reg-name:
    description: Name of the analog power supply regulator.
    $ref: /schemas/types.yaml#/definitions/string

  omnivision,bus-reg-name:
    description: Name of the bus I/O power supply regulator.
    $ref: /schemas/types.yaml#/definitions/string

  omnivision,spi-mode:
    description: SPI mode (0-3) used for SPI transfers.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,byte-delay-us:
    description: Delay in microseconds between bytes during SPI transfers.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,block-delay-us:
    description: Delay in microseconds between blocks during SPI transfers.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,ubl-max-freq:
    description: Maximum SPI clock frequency in Hz for the bootloader mode.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,ubl-byte-delay-us:
    description: Delay in microseconds between bytes for the bootloader mode.
    $ref: /schemas/types.yaml#/definitions/uint32

  omnivision,x-flip:
    description: Invert the X axis.
    type: boolean

  omnivision,y-flip:
    description: Invert the Y axis.
    type: boolean

  omnivision,swap-axes:
    description: Swap the X and Y axes.
    type: boolean

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "omnivision,tcm-spi";
            reg = <0>;

            spi-max-frequency = <9600000>;

            firmware-name = "X6816DRU_TD4160_TM_fw.img";

            omnivision,irq-gpio = <&gpio 144 GPIO_ACTIVE_HIGH>;
            omnivision,reset-gpio = <&gpio 145 GPIO_ACTIVE_HIGH>;
            omnivision,irq-on-state = <0>;
            omnivision,reset-on-state = <0>;
            omnivision,reset-active-ms = <20>;
            omnivision,reset-delay-ms = <200>;
            omnivision,spi-mode = <3>;
            omnivision,byte-delay-us = <0>;
            omnivision,block-delay-us = <0>;
        };
    };
