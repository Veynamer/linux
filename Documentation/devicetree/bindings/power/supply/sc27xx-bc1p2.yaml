# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/sc27xx-bc1p2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC27XX PMICs BC1.2 charger detection

maintainers:
  - Veynamer <veyr1thalone@gmail.com>

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    enum:
      - sprd,sc2720-bc1p2
      - sprd,sc2721-bc1p2
      - sprd,sc2730-bc1p2
      - sprd,sc2731-bc1p2

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        charger-detect@1b9c {
            compatible = "sprd,sc2730-bc1p2";
            reg = <0x1b9c>;
        };
    };
...
